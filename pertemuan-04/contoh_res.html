<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        .container {
            display: grid;
            gap: 20px;
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .konten,
        .sidebar {
            min-width: 0;
            padding: 20px;
            border-radius: 8px;
            background: #dbeafe;
        }

        .sidebar {
            background: #e2e8f0;
        }

        button {
            padding: 12px 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* 4. Tablet */
        @media (min-width: 768px) {
            .container {
                grid-template-columns: 2fr 1fr;
                padding: 0 20px;
            }
        }

        /* 5. Desktop */
        @media (min-width: 1024px) {
            .container {
                gap: 30px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="konten">
            <h2>Solusi Digital untuk Masa Depan</h2>
            <p>
                Kami membantu Anda mempelajari teknologi
                dan membangun website modern.
            </p>
            <button>Pelajari Lebih Lanjut</button>
        </section>
        <aside class="sidebar">
            <h3>Layanan Kami</h3>
            <p>Web Development</p>
            <p>UI/UX Design</p>
            <p>Digital Marketing</p>
        </aside>

    </main>
</body>

</html>
