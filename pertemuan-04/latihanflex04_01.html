<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
            background: #17365d;
            color: white;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            padding: 25px;
        }

        @media (max-width: 480px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            nav {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Web Studio</h2>
        <nav>
            <a href="#">Beranda</a>
            <a href="#">Layanan</a>
            <a href="#">Tentang</a>
            <a href="#">Kontak</a>
        </nav>
    </header>
    <main>
        <h1>Selamat Datang</h1>
        <p>
            Belajar membuat website menggunakan CSS Flexbox.
        </p>
    </main>
</body>

</html>
