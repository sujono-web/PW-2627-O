<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Flexbox</title>
    <style>
        .container {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #e2e8f0;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .item {
            padding: 20px;
            background: #2563eb;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>
    <h2>Belajar CSS Flexbox</h2>
    <div class="container">
        <div class="item">
            Item 1
            Item 1Item 1Item 1
            Item 1Item 1
            Item 1
            Item 1
        </div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 3</div>
        <div class="item">Item 3</div>
        <div class="item">Item 3</div>
    </div>

</body>

</html>
