<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulir.css">
    <title>Document</title>
</head>

<body>
    <h1>Form Pendaftaran</h1>
    <form action="#" method="post" class="form-box">
        <div>
            <label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label>Jenis Kelamin:</label>
            <input type="radio" id="laki" name="gender" value="Laki-laki" class="radio-group">
            <label for="laki">Laki-laki</label>
            <input type="radio" id="perempuan" name="gender" value="Perempuan" class="radio-group">
            <label for="perempuan">Perempuan</label>
        </div>
        <div>
            <label for="prodi">Program Studi:</label>
            <select id="prodi" name="prodi">
                <option>-- Pilih Program Studi --</option>
                <option value="SI">Sistem Informasi</option>
                <option value="TI">Teknik Informatika</option>
            </select>
        </div>
        <div>
            <label for="pesan">Pesan:</label>
            <textarea id="pesan" name="pesan" class="form-box textarea"></textarea>
        </div>
        <button type="submit" class="btn-kirfin">Kirim</button>
    </form>
</body>

</html>
